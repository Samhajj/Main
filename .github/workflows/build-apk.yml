name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Allows uploading files flat from a phone: moves them into lib/ if needed
      - name: Arrange sources
        run: |
          mkdir -p lib
          [ -f main.dart ] && mv main.dart lib/ || true
          [ -f compress_service.dart ] && mv compress_service.dart lib/ || true

      - name: Generate platform folders
        run: flutter create --org com.clearstatus --project-name clear_status --platforms=android .

      - name: Set minSdk to 24
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] && sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$f" || true
          done

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: clear-status-apk
          path: build/app/outputs/flutter-apk/app-release.apk
